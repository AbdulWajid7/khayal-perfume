<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0b08"/>
      <stop offset="55%" stop-color="#131210"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow4" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a1814"/>
      <stop offset="40%" stop-color="#28241c"/>
      <stop offset="60%" stop-color="#362f22"/>
      <stop offset="100%" stop-color="#0f0d0a"/>
    </linearGradient>
    <linearGradient id="liquid4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b6a3a"/>
      <stop offset="100%" stop-color="#4a3620"/>
    </linearGradient>
    <linearGradient id="cap4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg4)"/>
  <ellipse cx="200" cy="225" rx="150" ry="150" fill="url(#glow4)"/>

  <ellipse cx="200" cy="410" rx="72" ry="12" fill="#000000" opacity="0.5"/>

  <!-- squat rounded bottle -->
  <rect x="140" y="240" width="120" height="150" rx="28" fill="url(#glass4)" stroke="#4a3d24" stroke-width="1"/>
  <rect x="150" y="270" width="100" height="110" rx="20" fill="url(#liquid4)" opacity="0.75"/>

  <circle cx="200" cy="205" r="26" fill="url(#cap4)"/>
  <rect x="185" y="228" width="30" height="30" fill="url(#glass4)" stroke="#4a3d24" stroke-width="1"/>

  <rect x="164" y="300" width="72" height="42" rx="2" fill="#050505" stroke="#d4af37" stroke-width="0.75" opacity="0.9"/>
  <text x="200" y="318" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#d4af37" text-anchor="middle" letter-spacing="1.5">KHAYAL</text>
  <text x="200" y="330" font-family="ui-sans-serif, system-ui, sans-serif" font-size="5.5" fill="#8b7355" text-anchor="middle" letter-spacing="1">SANDALWOOD NOCTURNE</text>

  <text x="200" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#8b7355" text-anchor="middle" letter-spacing="2.5">SANDALWOOD NOCTURNE</text>
