<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0b08"/>
      <stop offset="55%" stop-color="#141210"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1a16"/>
      <stop offset="35%" stop-color="#2a251c"/>
      <stop offset="55%" stop-color="#3a3020"/>
      <stop offset="100%" stop-color="#100e0b"/>
    </linearGradient>
    <linearGradient id="liquid1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#6b4a12"/>
    </linearGradient>
    <linearGradient id="cap1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f5d76e"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#8a6d1f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="500" fill="url(#bg1)"/>
  <ellipse cx="200" cy="230" rx="150" ry="150" fill="url(#glow1)"/>

  <!-- bottle shadow -->
  <ellipse cx="200" cy="410" rx="70" ry="12" fill="#000000" opacity="0.5"/>

  <!-- bottle body -->
  <rect x="150" y="190" width="100" height="200" rx="6" fill="url(#glass1)" stroke="#4a3d24" stroke-width="1"/>
  <rect x="158" y="230" width="84" height="140" rx="3" fill="url(#liquid1)" opacity="0.85"/>

  <!-- glass highlight -->
  <rect x="160" y="200" width="14" height="170" rx="6" fill="#ffffff" opacity="0.08"/>

  <!-- neck -->
  <rect x="182" y="150" width="36" height="45" fill="url(#glass1)" stroke="#4a3d24" stroke-width="1"/>

  <!-- cap -->
  <rect x="172" y="115" width="56" height="40" rx="4" fill="url(#cap1)"/>
  <rect x="172" y="115" width="56" height="8" rx="4" fill="#f5d76e" opacity="0.6"/>

  <!-- label -->
  <rect x="164" y="270" width="72" height="46" rx="2" fill="#050505" stroke="#d4af37" stroke-width="0.75" opacity="0.9"/>
  <text x="200" y="290" font-family="ui-sans-serif, system-ui, sans-serif" font-size="8" fill="#d4af37" text-anchor="middle" letter-spacing="1.5">KHAYAL</text>
  <text x="200" y="302" font-family="ui-sans-serif, system-ui, sans-serif" font-size="6" fill="#8b7355" text-anchor="middle" letter-spacing="1">OUD IMPERIAL</text>

  <text x="200" y="460" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#8b7355" text-anchor="middle" letter-spacing="3">OUD IMPERIAL</text>
</svg>
